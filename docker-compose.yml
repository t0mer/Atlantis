services:
  atlantis:
    image: techblog/atlantis:latest
    container_name: atlantis
    ports:
      - "8080:8080"
    volumes:
      # The database and the key that encrypts the stored passwords
      # (secret.key, created on first start). Back them up together.
      - atlantis-data:/data
    restart: unless-stopped
    # Everything else is set in the web UI (Settings).

volumes:
  atlantis-data:
