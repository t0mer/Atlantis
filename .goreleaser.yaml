version: 2
project_name: atlantis

before:
  hooks:
    - go mod tidy -diff
    - make web

builds:
  - id: atlantis
    main: ./cmd/atlantis
    binary: atlantis
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github-native

release:
  github:
    owner: t0mer
    name: Atlantis
  footer: |
    Docker image: `techblog/atlantis:{{ .Version }}` (linux/amd64, linux/arm64, linux/arm/v7).
